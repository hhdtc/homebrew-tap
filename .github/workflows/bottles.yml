name: Bottles

# Manual trigger only.
# (~fire2)
# sync v1.1.4
# sync v1.1.5
# (~fire) When a newer upstream release exists (or bottles are
# missing): updates the formula (url + sha256), builds bottles for macOS
# (arm64/x86_64, Ventura + Sonoma + Sequoia) and Linux x86_64, publishes them
# as a tap release, and annotates the formula so `brew install` uses
# binaries (no local Go needed).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bottles.yml"
    inputs:
      force:
        description: "rebuild bottles even if the formula is current"
        required: false
        default: "false"
permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync latest upstream release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          VER=$(gh api repos/hhdtc/LNReaderTUI/releases/latest --jq .tag_name | sed 's/^v//')
          CUR=$(grep -oP 'url ".*tags/v\K[^"]+' Formula/lnreadertui.rb || true)
          echo "upstream=$VER current=$CUR"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          NEEDS_BOTTLES=$(grep -c 'bottle do' Formula/lnreadertui.rb || true)
          if [ "$VER" = "$CUR" ] && [ "$NEEDS_BOTTLES" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "unchanged and bottles present; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://github.com/hhdtc/LNReaderTUI/archive/refs/tags/v$VER.tar.gz"
          curl -sL -o src.tar.gz "$URL"
          SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)
          python3 - "$VER" "$SHA" <<'PY'
          import re, sys
          ver, sha = sys.argv[1], sys.argv[2]
          p = 'Formula/lnreadertui.rb'
          s = open(p).read()
          s = re.sub(r'url "[^"]*"', f'url "https://github.com/hhdtc/LNReaderTUI/archive/refs/tags/v{ver}.tar.gz"', s, count=1)
          s = re.sub(r'sha256 "[0-9a-f]*"', f'sha256 "{sha}"', s, count=1)
          s = re.sub(r'\n  bottle do.*?end', '', s, flags=re.S)
          open(p, 'w').write(s)
          PY
          # Commit + push the bump so the bottle jobs check out the new
          # formula (they run on their own fresh checkout).
          git add Formula/lnreadertui.rb
          git -c user.name="lnreadertui-bot" -c user.email="bot@users.noreply.github.com" \
            commit -m "lnreadertui: bump to v$VER" || true
          git push origin main || echo "push failed (will retry in assemble)"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  bottle-build:
    needs: update-formula
    if: needs.update-formula.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, tag: sonoma }
          - { os: macos-14, tag: arm64_sonoma }
          - { os: macos-15, tag: sequoia }
          - { os: macos-15, tag: arm64_sequoia }
          - { os: ubuntu-latest, tag: x86_64_linux }
    runs-on: ${{ matrix.os }}
    name: bottle ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # pick up the sync step's formula bump, pushed mid-run
      - uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Build bottle from source
        run: |
          # Fresh tap symlink: an existing tap dir makes `ln -sfn` silently
          # nest, leaving the stale clone to resolve the old version.
          TR="$(brew --repository)/Library/Taps/hhdtc/homebrew-tap"
          rm -rf "$TR"
          mkdir -p "$(brew --repository)/Library/Taps/hhdtc"
          ln -s "$PWD" "$TR"
          brew install --formula --build-bottle hhdtc/tap/lnreadertui 2>&1 | tail -6
          # Pack the installed Cellar into the standard bottle layout
          # (`lnreadertui/<version>/...`) — deterministic on every platform.
          VER="${{ needs.update-formula.outputs.version }}"
          CELLAR="$(brew --cellar)/lnreadertui/$VER"
          rm -rf stage && mkdir -p "stage/lnreadertui"
          cp -R "$CELLAR" "stage/lnreadertui/$VER"
          tar czf "lnreadertui-${{ needs.update-formula.outputs.version }}.${{ matrix.tag }}.bottle.tar.gz" -C stage lnreadertui
          ls -la *.tar.gz
          tar tzf "lnreadertui-${{ needs.update-formula.outputs.version }}.${{ matrix.tag }}.bottle.tar.gz" | head -4
      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.tag }}
          path: "*.tar.gz"

  assemble:
    needs: [update-formula, bottle-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottle-*
          merge-multiple: true
      - name: Annotate formula and publish tap release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update-formula.outputs.version }}
        run: |
          ls -la bottles/
          python3 - "$VERSION" <<'PY'
          import hashlib, os, re, sys
          ver = sys.argv[1]
          entries = []
          for f in sorted(os.listdir('bottles')):
              if not f.endswith('.tar.gz'):
                  continue
              m = re.match(rf'lnreadertui-+{re.escape(ver)}\.(.+?)\.bottle\.tar\.gz', f)
              if not m:
                  continue
              with open(os.path.join('bottles', f), 'rb') as fh:
                  sha = hashlib.sha256(fh.read()).hexdigest()
              entries.append((m.group(1), sha))
          p = 'Formula/lnreadertui.rb'
          s = open(p).read()
          root = f'https://github.com/hhdtc/homebrew-tap/releases/download/v{ver}'
          lines = ['  bottle do', f'    root_url "{root}"']
          for tag, sha in entries:
              lines.append(f'    sha256 cellar: :any_skip_relocation, {tag}: "{sha}"')
          lines.append('  end')
          s = re.sub(r'\n  bottle do.*?end', '', s, flags=re.S)
          s = s.replace('  license "MIT"', '  license "MIT"\n' + "\n".join(lines))
          open(p, 'w').write(s)
          print("bottle entries:", entries)
          PY
          git add Formula/lnreadertui.rb
          git -c user.name="lnreadertui-bot" -c user.email="bot@users.noreply.github.com" \
            commit -m "lnreadertui: update to v$VERSION with bottles" || echo "no changes to commit"
          git push origin main
          git tag -f "v$VERSION"
          git push -f origin "v$VERSION"
          gh release create "v$VERSION" --title "lnreadertui v$VERSION bottles" \
            --notes "Prebuilt bottles for lnreadertui v$VERSION" || true
          # Replace any stale assets and drop brew's testball noise.
          gh release upload "v$VERSION" bottles/*.tar.gz --clobber || true
          gh release delete-asset "v$VERSION" testball_bottle-0.1.intel_macintosh.bottle.tar.gz 2>/dev/null || true
          gh release delete-asset "v$VERSION" testball_bottle-0.1.sierra.bottle.tar.gz 2>/dev/null || true
