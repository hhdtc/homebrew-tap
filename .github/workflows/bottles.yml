name: Bottles

# Manual trigger only. When a newer upstream release exists (or bottles are
# missing): updates the formula (url + sha256), builds bottles for macOS
# (arm64/x86_64, Ventura + Sonoma + Sequoia) and Linux x86_64, publishes them
# as a tap release, and annotates the formula so `brew install` uses
# binaries (no local Go needed).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bottles.yml"
    inputs:
      force:
        description: "rebuild bottles even if the formula is current"
        required: false
        default: "false"
permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync latest upstream release
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          VER=$(gh api repos/hhdtc/LNReaderTUI/releases/latest --jq .tag_name | sed 's/^v//')
          CUR=$(grep -oP 'url ".*tags/v\K[^"]+' Formula/lnreadertui.rb || true)
          echo "upstream=$VER current=$CUR"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          NEEDS_BOTTLES=$(grep -c 'bottle do' Formula/lnreadertui.rb || true)
          if [ "$VER" = "$CUR" ] && [ "$NEEDS_BOTTLES" != "0" ] && [ "$FORCE" != "true" ]; then
            echo "unchanged and bottles present; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL="https://github.com/hhdtc/LNReaderTUI/archive/refs/tags/v$VER.tar.gz"
          curl -sL -o src.tar.gz "$URL"
          SHA=$(sha256sum src.tar.gz | cut -d' ' -f1)
          python3 - "$VER" "$SHA" <<'PY'
          import re, sys
          ver, sha = sys.argv[1], sys.argv[2]
          p = 'Formula/lnreadertui.rb'
          s = open(p).read()
          s = re.sub(r'url "[^"]*"', f'url "https://github.com/hhdtc/LNReaderTUI/archive/refs/tags/v{ver}.tar.gz"', s, count=1)
          s = re.sub(r'sha256 "[0-9a-f]*"', f'sha256 "{sha}"', s, count=1)
          s = re.sub(r'\n  bottle do.*?end', '', s, flags=re.S)
          open(p, 'w').write(s)
          PY
          echo "changed=true" >> "$GITHUB_OUTPUT"

  bottle-build:
    needs: update-formula
    if: needs.update-formula.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-13, tag: ventura }
          - { os: macos-13, tag: arm64_ventura }
          - { os: macos-14, tag: sonoma }
          - { os: macos-14, tag: arm64_sonoma }
          - { os: macos-15, tag: sequoia }
          - { os: macos-15, tag: arm64_sequoia }
          - { os: ubuntu-latest, tag: x86_64_linux }
    runs-on: ${{ matrix.os }}
    name: bottle ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@master
      - name: Build bottle from source
        run: |
          brew install --formula --build-from-source ./Formula/lnreadertui.rb 2>&1 | tail -6
          brew bottle lnreadertui 2>&1 | tail -3
          ls *.bottle.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: bottle-${{ matrix.tag }}
          path: "*.bottle.tar.gz"

  assemble:
    needs: [update-formula, bottle-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: bottles
          pattern: bottle-*
          merge-multiple: true
      - name: Annotate formula and publish tap release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update-formula.outputs.version }}
        run: |
          ls -la bottles/
          python3 - "$VERSION" <<'PY'
          import hashlib, os, re, sys
          ver = sys.argv[1]
          bottles_dir = 'bottles'
          entries = []
          for f in sorted(os.listdir(bottles_dir)):
              if not f.endswith('.bottle.tar.gz'):
                  continue
              tag = f.split('.bottle.tar.gz')[0].split(f'lnreadertui-{ver}')[-1]
              if tag.startswith('.'):
                  tag = tag[1:]
              # stable: tag = e.g. arm64_ventura or sonoma
              tag = tag.split('-')[0]
              with open(os.path.join(bottles_dir, f), 'rb') as fh:
                  sha = hashlib.sha256(fh.read()).hexdigest()
              entries.append((tag, sha))
          p = 'Formula/lnreadertui.rb'
          s = open(p).read()
          root = f'https://github.com/hhdtc/homebrew-tap/releases/download/v{ver}'
          lines = ['  bottle do', f'    root_url "{root}"']
          for tag, sha in entries:
              lines.append(f'    sha256 cellar: :any_skip_relocation, {tag}: "{sha}"')
          lines.append('  end')
          s = s.replace('  license "MIT"', '  license "MIT"\n' + "\n".join(lines))
          open(p, 'w').write(s)
          print("bottle entries:", entries)
          PY
          git add Formula/lnreadertui.rb
          git -c user.name="lnreadertui-bot" -c user.email="bot@users.noreply.github.com" \
            commit -m "lnreadertui: update to v$VERSION with bottles" || echo "no changes to commit"
          git push origin main
          git tag -f "v$VERSION"
          git push -f origin "v$VERSION"
          gh release create "v$VERSION" bottles/*.bottle.tar.gz --title "lnreadertui v$VERSION bottles" \
            --notes "Prebuilt bottles for lnreadertui v$VERSION" || true
